<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Jeden samostatný soubor: funguje offline, bez instalace. Vygenerováno z obsahu zápisů 2.D. -->
<style>
:root{
  --bg:#0f1318; --bg2:#141a21; --surface:#18202a; --surface2:#1f2935; --line:#2b3644; --line2:#3a4757;
  --text:#e7ecf2; --strong:#ffffff; --muted:#a6b1be; --dim:#8794a3;
  --accent:#86bbff; --accent-strong:#5f9ff4; --accent-bg:rgba(124,180,255,.12);
  --ok:#62d690; --ok-bg:rgba(98,214,144,.12); --bad:#ff8a8a; --bad-bg:rgba(255,138,138,.12);
  --warn:#f2c55c; --warn-bg:rgba(242,197,92,.10);
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:860px;margin:0 auto;padding:0 16px}
main{flex:1;padding-top:18px;padding-bottom:40px;outline:none}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:1.6rem;line-height:1.25;margin:.15em 0 .4em;color:var(--strong)}
h2{font-size:1.25rem;line-height:1.3;color:var(--strong)}
h3{font-size:1.08rem;margin:1.4em 0 .5em;color:var(--strong)}
p{margin:.5em 0}
.muted{color:var(--muted)} .small{font-size:.9rem}
kbd{display:inline-block;font:600 .72rem/1 ui-monospace,Consolas,monospace;padding:.28em .45em;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--bg2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hlavička */
.top{position:sticky;top:0;z-index:10;background:rgba(15,19,24,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{color:var(--text);font-weight:700;font-size:1rem;display:flex;flex-direction:column;line-height:1.2}
.brand span{font-weight:500;font-size:.78rem;color:var(--muted)}
.brand:hover{text-decoration:none}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs a{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:.95rem;min-height:40px;display:flex;align-items:center}
.tabs a[aria-current="page"]{background:var(--surface2);color:var(--strong);box-shadow:inset 0 0 0 1px var(--line2)}
.tabs a:hover{text-decoration:none;color:var(--strong)}

/* tlačítka */
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font:inherit;font-weight:600;font-size:.95rem;line-height:1.25;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,border-color .15s}
.btn:hover{background:#263241;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#06111f}
.btn.primary:hover{background:#74aef8}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.good{border-color:rgba(98,214,144,.5);background:var(--ok-bg);color:var(--ok)}
.btn.bad{border-color:rgba(255,138,138,.5);background:var(--bad-bg);color:var(--bad)}
.btn.big{min-height:52px;padding:12px 24px;font-size:1.05rem}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.chosen{opacity:1;box-shadow:0 0 0 2px currentColor inset}
.btn.dimmed{opacity:.35}
.btn kbd{background:rgba(0,0,0,.18);color:inherit;border-color:currentColor;opacity:.75}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:.9rem;padding:10px 0 0}
.linkbtn:hover{color:var(--text)}

/* domů */
.hero p{margin:.1em 0 1.1em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{display:flex;gap:12px;align-items:center;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--text)}
.tile:hover{border-color:var(--line2);background:var(--surface2);text-decoration:none}
.tile b{display:block;color:var(--strong)}
.tile small{display:block;font-size:.85rem;line-height:1.35;color:var(--muted)}
.ti{font-size:1.5rem;line-height:1}
.tile-test{border-color:rgba(124,180,255,.5);background:linear-gradient(180deg,rgba(124,180,255,.13),rgba(124,180,255,.04))}
.sec{font-size:1.05rem;margin:28px 0 12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.topic.main{border-color:rgba(242,197,92,.45)}
.topic-h{display:flex;gap:12px;align-items:flex-start}
.topic h3{margin:0;font-size:1.06rem}
.topic p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.num{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface2);border:1px solid var(--line2);font-weight:700;font-size:.92rem;color:var(--accent)}
.star{color:var(--warn);font-weight:600}
.meta{display:flex;gap:14px;color:var(--dim);font-size:.85rem}
.bestbar{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bestbar .lbl{color:var(--dim)}
.bar{flex:1;height:7px;border-radius:7px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:7px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.topic .acts{margin-top:auto}
.topic .acts .btn{flex:1 1 0;padding:10px 6px;min-width:0}

/* téma */
.crumbs{margin-bottom:8px;font-size:.92rem}
.ttl{display:flex;align-items:flex-start;gap:12px}
.ttl .num{margin-top:4px}
.ttl h1{margin:0}
.ttl p{margin:0}
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 16px}
.seg a{flex:1;text-align:center;padding:10px 6px;border-radius:9px;color:var(--muted);font-weight:600;min-height:42px}
.seg a:hover{text-decoration:none;color:var(--strong)}
.seg a.on{background:var(--surface2);color:var(--strong);box-shadow:inset 0 0 0 1px var(--line2)}

/* tahák */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 20px 18px;overflow-wrap:break-word}
.sheet > :first-child{margin-top:14px}
.sheet ul,.sheet ol{padding-left:1.3em;margin:.4em 0}
.sheet li{margin:.28em 0}
.sheet q{quotes:"„" "“";font-style:italic;color:var(--strong)}
.sheet b{color:var(--strong)}
.lead{font-size:1.05rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-bg);color:var(--accent);vertical-align:middle;margin-left:6px;white-space:nowrap}
.note{background:var(--accent-bg);border:1px solid rgba(124,180,255,.3);border-radius:12px;padding:12px 14px;margin:14px 0}
.note ul{margin:.3em 0 0}
.warn{background:var(--warn-bg);border:1px solid rgba(242,197,92,.38);border-radius:12px;padding:12px 14px;margin:14px 0}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-weight:700;color:var(--strong)}
tr:last-child td{border-bottom:0}
td ul{margin:0;padding-left:1.1em}
tr.hl td{background:rgba(124,180,255,.08)}
tr.bonus td{color:var(--muted)}
table.voc td:first-child{font-weight:600;color:var(--strong);width:48%}
.steps li{margin:.4em 0}
ul.x{list-style:none;padding-left:0}
ul.ex li{font-style:italic}
.flow{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.letter{border:1px solid var(--line2);border-radius:10px;padding:14px;background:var(--bg2);display:grid;gap:8px;font-size:.92rem}
.letter .r{text-align:right}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* kvíz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.92rem;margin-bottom:8px}
.qtop b{color:var(--strong)}
.okc{color:var(--ok);font-weight:600} .badc{color:var(--bad);font-weight:600}
.timer{margin-left:10px;font-variant-numeric:tabular-nums}
.progress{height:7px;background:var(--bg2);border-radius:7px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
.badge.bonus{color:var(--warn);border-color:rgba(242,197,92,.5)}
.badge.ctx{color:var(--accent);border-color:rgba(124,180,255,.5)}
.qtext{font-size:1.18rem;line-height:1.45;font-weight:600;margin-bottom:16px;color:var(--strong);overflow-wrap:break-word}
.qtext .hint{display:inline-block;font-weight:500;color:var(--muted);font-size:.92rem}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:12px 14px;min-height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font:inherit;font-size:1rem;line-height:1.4;cursor:pointer;transition:border-color .12s,background .12s;overflow-wrap:break-word}
.opt span{min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent);background:#17212d}
.opt kbd{flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--strong)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.fill{display:flex;gap:8px}
.fill input,textarea{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);color:var(--text)}
textarea{width:100%;resize:vertical;font-size:1rem;line-height:1.45}
.fill input::placeholder,textarea::placeholder{color:var(--dim)}
.fill input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,180,255,.22)}
.fill input.right{border-color:var(--ok);background:var(--ok-bg)} .fill input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fill input:disabled{opacity:1;color:var(--text)}
.nudge{animation:nudge .35s}
@keyframes nudge{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:rgba(98,214,144,.45)}
.fb.bad{background:var(--bad-bg);border-color:rgba(255,138,138,.45)}
.fb-h{font-weight:700;font-size:1.05rem}
.fb.ok .fb-h{color:var(--ok)} .fb.bad .fb-h{color:var(--bad)}
.fb-a{margin-top:4px}
.fb-a b{color:var(--strong)}
.fb-e{margin-top:6px;color:#dde3ea}
.fb-e span{color:var(--muted);font-weight:700}
.fb-x{margin-top:4px;color:var(--warn)}
.model{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-top:12px}
.model .lbl{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.model ul,.model ol{margin:.3em 0;padding-left:1.25em}
.selfq{margin:12px 0 8px}
.self{display:flex;gap:8px;flex-wrap:wrap}
.self .btn{flex:1 1 140px}
.qnav{display:flex;justify-content:flex-end;margin-top:16px}
.qnav .btn{min-width:190px}

/* výsledek */
.result{display:flex;align-items:center;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.ring{--p:0;flex:none;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p) * 1%),var(--bg2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-weight:800;font-size:1.3rem;color:var(--strong)}
.result h2{margin:0 0 4px}
.result p{margin:0;color:var(--muted)}
.nb{color:var(--warn)}
.res-acts{margin-bottom:6px}
.mistakes{padding-left:1.4em;margin:0}
.mistakes li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.mistakes li::marker{color:var(--dim)}
.mistakes .badge{margin-bottom:6px}
.m-q{font-weight:600;margin-bottom:6px;color:var(--strong)}
.m-row{display:flex;gap:10px;font-size:.95rem;margin:3px 0}
.m-row .lbl{flex:none;width:120px;color:var(--muted)}
.m-row .bad{color:var(--bad);overflow-wrap:anywhere} .m-row .ok{color:var(--ok)}
.m-e{margin-top:6px;font-size:.93rem;color:#d3dae2;border-top:1px solid var(--line);padding-top:6px}
details summary{cursor:pointer;color:var(--accent)}
details .model{color:var(--text)}
.allok{font-size:1.1rem}

/* kartičky */
.flip{perspective:1200px;cursor:pointer;margin:6px 0 14px;outline:none;border-radius:var(--radius);-webkit-tap-highlight-color:transparent}
.flip:focus-visible .face{box-shadow:0 0 0 2px var(--accent)}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;min-height:240px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line2);padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow-wrap:break-word}
.front{background:var(--surface)}
.back{background:#1a2634;border-color:rgba(124,180,255,.45);transform:rotateY(180deg)}
.ftext{font-size:1.28rem;font-weight:600;line-height:1.4;color:var(--strong);max-width:100%}
.back .ftext{font-size:1.12rem;font-weight:500}
.back .ftext b{color:var(--accent)}
.face .hint{font-size:.8rem;color:var(--dim)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbtns .btn{min-height:56px;font-size:1rem}
.cardtools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* test – nastavení */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.quota{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;font-size:.92rem;color:var(--muted)}
.quota li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.quota b{color:var(--strong)}
.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--accent-strong)}

.foot{color:var(--dim);font-size:.82rem;padding-top:8px;padding-bottom:24px;text-align:center;line-height:2}

@media (hover:none){.foot,.kbdhint,.opt kbd,.btn kbd{display:none}}
@media (max-width:720px){.tiles,.topics{grid-template-columns:1fr}}
@media (max-width:480px){
  body{font-size:16px}
  h1{font-size:1.35rem}
  .brand span{display:none}
  .tabs a{padding:8px 11px}
  .qcard{padding:14px}
  .sheet{padding:4px 14px 14px}
  .qtext{font-size:1.08rem}
  .fill{flex-direction:column}
  .qnav .btn,.sheet-foot .btn,.res-acts .btn{width:100%}
  .result{flex-direction:column;text-align:center}
  .m-row{flex-direction:column;gap:0}
  .m-row .lbl{width:auto;font-size:.82rem}
  th,td{padding:8px 9px}
  .quota{grid-template-columns:1fr}
  .ftext{font-size:1.15rem}
  .back .ftext{font-size:1.05rem}
}
td .tag{white-space:normal;margin:4px 0 0}
@media (max-width:600px){
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr:first-child{display:none}
  table.stack tr{border-bottom:1px solid var(--line);padding:8px 0}
  table.stack tr:last-child{border-bottom:0}
  table.stack td{border:0;padding:3px 14px}
  table.stack td:first-child{font-weight:700;color:var(--strong);padding-top:4px}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#eee;--bg2:#f4f4f4;--text:#000;--strong:#000;--muted:#333;--dim:#555;--line:#bbb;--line2:#999;--accent:#003a8c;--accent-bg:#eef3ff;--warn-bg:#fff8e6}
  .top,.foot,.seg,.crumbs,.sheet-foot{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .sheet{border:0;padding:0}
  .tablewrap{overflow:visible}
}

</style>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/cj">Procvičování 2.D <span>testy ve čtvrtek 19. 11. 2026</span></a>
    <nav class="tabs" aria-label="Předmět">
      <a href="#/cj" data-s="cj">Čeština</a>
      <a href="#/aj" data-s="aj">Angličtina</a>
    </nav>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer class="wrap foot">Klávesy: <kbd>1</kbd>–<kbd>4</kbd> výběr · <kbd>Enter</kbd> zkontrolovat / další · <kbd>Mezerník</kbd> otočit kartu · <kbd>←</kbd> Ještě ne · <kbd>→</kbd> Umím</footer>
<script>
/* Pomocné konstruktory otázek
   M = výběr ze 4 možností (a = správně, w = 3 špatné), F = doplňovačka (a = uznávané odpovědi),
   O = otevřená otázka se vzorovou odpovědí (sebehodnocení).
   x: { bonus:1 } 3. kondicionál „pokud jste brali“ · { ctx:1 } kontext mimo rozsah · { name:1 } stačí příjmení */
var DATA = {};
function M(q, a, w, e, x) { return Object.assign({ t: "mc", q: q, a: a, w: w, e: e }, x || {}); }
function F(q, a, e, x) { return Object.assign({ t: "fill", q: q, a: [].concat(a), e: e }, x || {}); }
function O(q, a, x) { return Object.assign({ t: "open", q: q, a: a }, x || {}); }

/* Tolerantní kontrola psaných odpovědí */
var Norm = (function () {
  function stripDia(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function stripTags(s) { return String(s).replace(/<[^>]*>/g, " "); }

  // malá písmena, bez diakritiky, bez interpunkce, jednotné apostrofy a mezery
  function base(s) {
    return stripDia(stripTags(s).toLowerCase())
      .replace(/[’‘`´ʼ]/g, "'")
      .replace(/[–—]/g, "-")
      .replace(/[„“”"«»]/g, " ")
      .replace(/[.,!?;:…()\[\]\/]/g, " ")
      .replace(/\s*-\s*/g, "-")
      .replace(/\s+/g, " ")
      .trim()
      .replace(/^-+|-+$/g, "")
      .trim();
  }

  var PRON_S = /\b(he|she|it|that|there|what|who|here|where|how|this|everyone|nobody|somebody|someone)'s\b/g;

<h3>1. kondicionál – pravidla</h3>
<ul>
<li>Po <b>if</b> je přítomný čas: if I <b>have</b> time tomorrow (✗ if I will have).</li>
<li>he / she / it → <b>-s</b>: if she want<b>s</b>; zápor <b>don't / doesn't</b>, <b>isn't</b>.</li>
<li>I'll = I will, won't = will not.</li>
<li>Výjimka: <b>will</b> po if ve významu <b>ochoty</b> (If you will help me, …).</li>
<li>Hlavní věta může být <b>otázka</b> nebo <b>pokyn</b>: If you have time tomorrow, can you call me? / If you're in town next week, get in touch.</li>
<li>Místo will může být <b>may / might</b> (možná) nebo <b>can</b> (můžeš, smíš): If it rains, we might stay at home.</li>
</ul>

<h3>Čárka</h3>
<p>If-věta <b>na začátku → čárka</b>: If you text me<b>,</b> I'll reply immediately.<br>If-věta <b>na konci → bez čárky</b>: I'll reply immediately if you text me.</p>

<h3>unless = if not</h3>
<p>Unless you hurry, you'll miss the bus. = If you don't hurry, you'll miss the bus. (po unless je sloveso kladně)</p>

<h3>Rada: If I were you…</h3>
<p>If I were you, I'd apologise. (u všech osob <b>were</b>)</p>

<h3>Postup při tvoření věty</h3>
<ol class="steps"><li>Urči podmínku a výsledek.</li><li>Do if-věty dej přítomný čas (pozor na -s a zápor).</li><li>V hlavní větě will / won't + infinitiv (nebo otázka či pokyn).</li><li>Zkontroluj čárku.</li></ol>

<li>She will have to work very hard if she wants to go to university.</li>

<li>If you come home late, your parents will worry.</li>

  }

  /* ---------- časomíra pro test ---------- */
  function startTimer() { stopTimer(); timerId = setInterval(updTimer, 1000); }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function updTimer() { var el = document.getElementById("timer"); if (el && Q) el.textContent = "⏱ " + fmt(Math.round((Date.now() - Q.t0) / 1000)); }

  /* ---------- zkušební test ---------- */
  function buildTest(S, strict) {
    var out = [], openLeft = strict ? 0 : (S.key === "cj" ? 2 : 0);
    S.topics.forEach(function (t) {
      var need = S.quotas[t.id] || 0;
      shuffle(t.qs.filter(function (q) { return !q.bonus && !q.ctx; })).forEach(function (q) {
        if (!need) return;
        if (q.t === "open") { if (openLeft <= 0) return; openLeft--; }
        out.push(q); need--;
      });
    });
    return out;
  }
  function renderTestSetup(S) {
    view = "testsetup";
    var b = store.get("best", {})[S.key + ":test"], strict = !!store.get("strict", false);
    app.innerHTML = crumbs(S) + "<h1>Zkušební test – " + S.name + "</h1>" +
      '<div class="card setup"><p>' + S.testInfo + "</p>" +
      '<ul class="quota">' + S.topics.map(function (t) { var n = S.quotas[t.id] || 0; return "<li><span>" + t.title + "</span><b>" + n + "×</b></li>"; }).join("") + "</ul>" +
      '<label class="check"><input type="checkbox" id="strict"' + (strict ? " checked" : "") + "><span><b>Ostrý režim</b> – bez průběžné kontroly, výsledek a vysvětlení až na konci (jako ve škole)." + (S.key === "cj" ? " Bez otevřených otázek." : "") + "</span></label>" +
      '<button type="button" class="btn primary big" id="go">Spustit test</button>' +
      (b != null ? '<p class="muted small">Nejlepší výsledek: <b>' + b + " %</b></p>" : "") + '</div><div id="pane"></div>';
    $("#go").onclick = function () {
      var st = $("#strict").checked; store.set("strict", st);
      var pane = $("#pane"); $(".setup").remove();
      startQuiz({ mount: pane, qs: buildTest(S, st), key: S.key + ":test", mode: "test", subj: S.key, strict: st, rebuild: function () { return buildTest(S, st); } });
    };
  }

  /* ---------- moje chyby ---------- */
  function renderMistakes(S) {
    view = "mistakes";
    var qs = mistakesFor(S.key);
    app.innerHTML = crumbs(S) + "<h1>Moje chyby – " + S.name + "</h1>" + (qs.length
      ? '<p class="muted">Otázky, ve kterých byla naposledy chyba (' + qs.length + '). Po správné odpovědi ze seznamu zmizí. <button type="button" class="linkbtn" id="clr">Vymazat seznam</button></p><div id="pane"></div>'
      : '<div class="card"><p>Zatím tu nic není. Chyby z kvízů a testů se sem ukládají automaticky.</p><a class="btn primary" href="#/' + S.key + '">Na témata</a></div>');
    if (qs.length) {
      startQuiz({ mount: $("#pane"), qs: qs, mode: "mistakes", subj: S.key, key: null, rebuild: function () { var x = mistakesFor(S.key); return x.length ? x : qs; } });
      $("#clr").onclick = function () {
        if (!confirm("Opravdu vymazat seznam chyb pro " + S.name + "?")) return;
        var m = store.get("mist", {});
        S.topics.forEach(function (t) { t.qs.forEach(function (q) { delete m[q.id]; }); });
        store.set("mist", m); route();
      };
    }
  }

  /* ---------- kartičky ---------- */
  function renderAllCards(S) {
    app.innerHTML = crumbs(S) + "<h1>Všechny kartičky – " + S.name + '</h1><div id="pane"></div>';
    startCards({ mount: $("#pane"), cards: S.allCards, showTopic: true });
  }
  function startCards(o) {
    view = "cards";
    C = Object.assign({ known: 0, flipped: false, rev: !!store.get("rev", false), missed: {} }, o);
    C.queue = shuffle(o.cards.map(function (_, i) { return i; }));
    C.total = o.cards.length;
    renderCard();
  }
  function renderCard() {
    if (!C.queue.length) return cardsDone();
    var c = C.cards[C.queue[0]], front = C.rev ? c.b : c.f, back = C.rev ? c.f : c.b;
    C.flipped = false;
    C.mount.innerHTML =
      '<div class="qtop"><span>Zbývá <b>' + C.queue.length + '</b></span><span><span class="okc">Umím ' + C.known + "</span> / " + C.total + "</span></div>" +
      '<div class="progress"><i style="width:' + (C.known / C.total * 100) + '%"></i></div>' +
      '<div class="flip" id="card" tabindex="0" role="button" aria-label="Kartička – klikni nebo stiskni mezerník pro otočení">' +
      '<div class="flip-in"><div class="face front">' + (C.showTopic ? '<span class="badge">' + c.t + "</span>" : "") +
      '<div class="ftext">' + front + '</div><span class="hint">klikni nebo mezerník = otočit</span></div>' +
      '<div class="face back"><span class="hint">odpověď</span><div class="ftext">' + back + "</div></div></div></div>" +
      '<div class="cardbtns"><button type="button" class="btn bad" id="no">✗ Ještě ne <kbd>←</kbd></button><button type="button" class="btn good" id="yes">✓ Umím <kbd>→</kbd></button></div>' +
      '<div class="cardtools"><button type="button" class="btn ghost sm" id="rev">⇄ Otočit směr' + (C.rev ? " (zapnuto)" : "") + '</button><button type="button" class="btn ghost sm" id="restart">↻ Začít znovu</button></div>';
    var el = $("#card");
    el.onclick = flip;
    $("#yes").onclick = cardYes; $("#no").onclick = cardNo;
    $("#rev").onclick = function () { C.rev = !C.rev; store.set("rev", C.rev); renderCard(); };
    $("#restart").onclick = function () { startCards({ mount: C.mount, cards: C.cards, showTopic: C.showTopic }); };
    try { el.focus({ preventScroll: true }); } catch (e) { /* starší prohlížeč */ }
  }
  function flip() { if (!C || !C.queue.length) return; C.flipped = !C.flipped; $("#card").classList.toggle("on", C.flipped); }
  function cardYes() { if (!C || !C.queue.length) return; C.queue.shift(); C.known++; renderCard(); }
  function cardNo() { if (!C || !C.queue.length) return; var i = C.queue.shift(); C.missed[i] = 1; C.queue.push(i); renderCard(); }
  function cardsDone() {
    var miss = Object.keys(C.missed).map(Number);
    C.mount.innerHTML = '<section class="result"><div class="ring" style="--p:100"><span>✓</span></div><div><h2>Hotovo!</h2><p>Všech ' + C.total + " karet je za tebou. Napoprvé správně: " + (C.total - miss.length) + " z " + C.total + ".</p></div></section>" +
      '<div class="acts"><button type="button" class="btn primary" id="again">Znovu všechny</button>' +
      (miss.length ? '<button type="button" class="btn" id="hard">Jen ty, co nešly napoprvé (' + miss.length + ")</button>" : "") + "</div>";
    var all = C.cards, mount = C.mount, st = C.showTopic;
    $("#again").onclick = function () { startCards({ mount: mount, cards: all, showTopic: st }); };
    var h = $("#hard"); if (h) h.onclick = function () { startCards({ mount: mount, cards: miss.map(function (i) { return all[i]; }), showTopic: st }); };
  }

  /* ---------- klávesnice ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.metaKey) return;
    var t = e.target || {}, tag = (t.tagName || "").toUpperCase();
    var typing = tag === "INPUT" || tag === "TEXTAREA";
    if (view === "quiz" && cur()) return quizKey(e, t, tag, typing);
    if (view === "cards" && C && C.queue.length) return cardKey(e, typing);
    if (view === "testsetup" && e.key === "Enter" && tag !== "BUTTON" && tag !== "A" && !typing) { var g = $("#go"); if (g) { e.preventDefault(); g.click(); } }
  });
  function quizKey(e, t, tag, typing) {
    var it = cur(), q = it.q;
    if (e.key === "Enter") {
      if (e.repeat) { e.preventDefault(); return; }
      if (e.ctrlKey) { if (q.t === "open" && !it.revealed) { e.preventDefault(); reveal(); } return; }
      if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") {
        if (Q.strict && t.classList && t.classList.contains("opt") && !it.done) { e.preventDefault(); selectOpt(+t.dataset.i); answerMC(); }
        return; // tlačítko se aktivuje samo
      }
      if (tag === "TEXTAREA") return; // nový řádek
      e.preventDefault();
      if (it.done) return next();
      if (q.t === "mc") { if (it.sel != null) answerMC(); }
      else if (q.t === "fill") answerFill(false);
      else if (!it.revealed) reveal();
      return;
    }
    if (typing || e.ctrlKey) return;
    if (/^[1-4]$/.test(e.key)) {
      var k = +e.key;
      if (q.t === "mc" && !it.done) { e.preventDefault(); selectOpt(k - 1); }
      else if (q.t === "open" && it.revealed && !it.done && k <= 2) { e.preventDefault(); selfGrade(k === 1); }
    }
  }
  function cardKey(e, typing) {
    if (typing || e.ctrlKey) return;
    var k = e.key;
    if (k === " " || k === "Spacebar" || (k === "Enter" && e.target && e.target.id === "card")) { e.preventDefault(); flip(); }
    else if (k === "ArrowRight" || k === "u" || k === "U") { e.preventDefault(); cardYes(); }
    else if (k === "ArrowLeft" || k === "j" || k === "J") { e.preventDefault(); cardNo(); }
  }
  // mezerník na tlačítku by po keyup kartičku „odklikl“ znovu – zablokovat
  document.addEventListener("keyup", function (e) { if (view === "cards" && (e.key === " " || e.key === "Spacebar")) e.preventDefault(); });

  /* ---------- start ---------- */
  if (!location.hash) history.replaceState(null, "", "#/" + (store.get("subj", "cj") === "aj" ? "aj" : "cj"));
  route();
})();

</script>
</body>
</html>
